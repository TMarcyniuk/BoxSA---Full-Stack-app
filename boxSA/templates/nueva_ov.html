<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva OV - Box S.A.</title>
    <!-- Link modificado exactamente como lo solicitaste -->
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
    <header class="main-header">
        <div class="logo"><h1>Box S.A.</h1></div>
        <nav class="nav-links">
            <a href="/">Inicio</a>
            <a href="/ov/nueva" class="active">Órdenes de Venta</a>
        </nav>
        <div style="margin-right: 20px; color: #bdc3c7;">
            Operador: <strong>{{ session['vendedor_nombre'] }}</strong> 
            (<a href="/logout" style="color: #ff6b6b; font-size: 12px; text-decoration: none;">Salir</a>)
        </div>
    </header>

    <main class="dashboard-container">
        <h2>Crear Nueva Orden de Venta</h2>
        
        <div class="card" style="margin-top: 20px; text-align: left;">
            <div class="grid-2">
                <div class="form-group">
                    <label for="cliente">1. Seleccionar Cliente</label>
                    <select id="cliente" onchange="cargarProductos()">
                        <option value="">-- Seleccione un cliente --</option>
                        {% for cliente in clientes %}
                            <option value="{{ cliente.idCliente }}">{{ cliente.razonSocial }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="fecha_entrega">Fecha de Entrega Estimada</label>
                    <input type="date" id="fecha_entrega" required>
                </div>
            </div>

            <hr style="margin: 20px 0;">

            <div class="grid-2">
                <div class="form-group">
                    <label for="producto">2. Seleccionar Producto</label>
                    <select id="producto">
                        <option value="">-- Primero seleccione un cliente --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cantidad">3. Cantidad</label>
                    <input type="number" id="cantidad" min="1" value="1">
                </div>
            </div>
            
            <button type="button" class="btn-action" onclick="agregarItem()">Añadir a la Orden</button>

            <!-- Una sola tabla bien estructurada -->
            <table class="table-items" id="tablaDetalle">
                <thead>
                    <tr>
                        <th>Cód. Producto</th>
                        <th>Descripción</th>
                        <th>Precio Unit.</th>
                        <th>Cantidad</th>
                        <th>Subtotal Item</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Los items se agregan aquí por JS -->
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="4" style="text-align: right; font-weight: bold;">Subtotal Neto:</td>
                        <td colspan="2" id="lblSubtotal">$ 0.00</td>
                    </tr>
                    <tr>
                        <td colspan="4" style="text-align: right; font-weight: bold;">IVA (21%):</td>
                        <td colspan="2" id="lblIva">$ 0.00</td>
                    </tr>
                    <tr style="background-color: #e8f5e9;">
                        <td colspan="4" style="text-align: right; font-weight: bold; font-size: 18px;">TOTAL:</td>
                        <td colspan="2" id="lblTotal" style="font-weight: bold; font-size: 18px;">$ 0.00</td>
                    </tr>
                </tfoot>
            </table>

            <div style="margin-top: 30px; text-align: right;">
                <button type="button" class="btn-action" onclick="guardarOV()" style="background-color: #2c3e50;">Generar Orden de Venta</button>
            </div>
        </div>
    </main>

    <script>
        let itemsOV = []; 
        let subtotalGlobal = 0;
        let totalGlobal = 0;

        function cargarProductos() {
            const idCliente = document.getElementById('cliente').value;
            const selectProducto = document.getElementById('producto');
            
            selectProducto.innerHTML = '<option value="">Cargando productos...</option>';
            if (!idCliente) {
                selectProducto.innerHTML = '<option value="">-- Primero seleccione un cliente --</option>';
                return;
            }

            fetch(`/api/productos/${idCliente}`)
                .then(response => response.json())
                .then(data => {
                    selectProducto.innerHTML = '<option value="">-- Seleccione un producto --</option>';
                    data.forEach(prod => {
                        const precio = prod.pUnitario ? parseFloat(prod.pUnitario) : 0.0;
                        selectProducto.innerHTML += `<option value="${prod.idProducto}" data-cod="${prod.CodProd}" data-desc="${prod.desc}" data-precio="${precio}">[${prod.CodProd}] ${prod.desc} - $${precio.toFixed(2)}</option>`;
                    });
                });
        }

        function agregarItem() {
            const selectProducto = document.getElementById('producto');
            const cantidad = parseInt(document.getElementById('cantidad').value);
            
            if(!selectProducto.value || cantidad <= 0) {
                alert("Seleccione un producto y una cantidad válida.");
                return;
            }

            const opcion = selectProducto.options[selectProducto.selectedIndex];
            const idProducto = selectProducto.value;
            const codProd = opcion.dataset.cod;
            const desc = opcion.dataset.desc;
            const precioUnit = parseFloat(opcion.dataset.precio);
            const subtotalItem = precioUnit * cantidad;

            itemsOV.push({ idProducto, codProd, desc, precioUnit, cantidad, subtotalItem });
            renderizarTabla();
        }

        function renderizarTabla() {
            const tbody = document.querySelector('#tablaDetalle tbody');
            tbody.innerHTML = '';
            
            subtotalGlobal = 0;

            itemsOV.forEach((item, index) => {
                subtotalGlobal += item.subtotalItem;
                tbody.innerHTML += `
                    <tr>
                        <td>${item.codProd}</td>
                        <td>${item.desc}</td>
                        <td>$ ${item.precioUnit.toFixed(2)}</td>
                        <td>${item.cantidad}</td>
                        <td>$ ${item.subtotalItem.toFixed(2)}</td>
                        <td><button onclick="eliminarItem(${index})" style="color: red; cursor: pointer; border:none; background:none;">Quitar</button></td>
                    </tr>
                `;
            });

            const iva = subtotalGlobal * 0.21;
            totalGlobal = subtotalGlobal + iva;

            document.getElementById('lblSubtotal').innerText = '$ ' + subtotalGlobal.toFixed(2);
            document.getElementById('lblIva').innerText = '$ ' + iva.toFixed(2);
            document.getElementById('lblTotal').innerText = '$ ' + totalGlobal.toFixed(2);
        }

        function eliminarItem(index) {
            itemsOV.splice(index, 1);
            renderizarTabla();
        }

        function guardarOV() {
            const idCliente = document.getElementById('cliente').value;
            const fechaEntrega = document.getElementById('fecha_entrega').value;

            if(!idCliente || !fechaEntrega) {
                alert("Por favor, seleccione un cliente y asigne una fecha de entrega.");
                return;
            }
            if(itemsOV.length === 0) {
                alert("Agregue al menos un producto a la orden.");
                return;
            }

            const datos = {
                idCliente: idCliente,
                fechaEntrega: fechaEntrega,
                subtotal: subtotalGlobal,
                total: totalGlobal,
                items: itemsOV
            };

            // Enviar al Backend (Consignas 4, 5, 6 y 7)
            fetch('/api/ov/guardar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            })
            .then(response => response.json())
            .then(res => {
                if(res.success) {
                    alert("¡Éxito! " + res.mensaje);
                    window.location.href = "/"; // Volvemos al inicio tras guardar
                } else {
                    alert("Error: " + res.mensaje);
                }
            })
            .catch(err => alert("Ocurrió un error en la conexión."));
        }
    </script>
</body>
</html>
