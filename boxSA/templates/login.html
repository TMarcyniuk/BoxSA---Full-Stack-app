<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingreso - Box S.A.</title>
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div class="card" style="width: 400px;">
        <h2>Ingreso a Box S.A.</h2>
        <p style="margin-bottom: 20px; color: #7f8c8d;">Seleccione su usuario vendedor:</p>
        <form method="POST" action="/login">
            <div class="form-group">
                <select name="vendedor_id" id="vendedor_select" required style="width: 100%; padding: 10px; margin-bottom: 15px;">
                    <option value="">-- Seleccione un vendedor --</option>
                    {% for v in vendedores %}
                        <option value="{{ v.idUsuario }}">{{ v.nombre }} {{ v.apellido }}</option>
                    {% endfor %}
                </select>
                <!-- Input oculto para capturar el nombre -->
                <input type="hidden" name="vendedor_nombre" id="vendedor_nombre">
            </div>
            <button type="submit" class="btn-action" style="width: 100%;">Ingresar</button>
        </form>
    </div>
    
    <script>
        document.getElementById('vendedor_select').addEventListener('change', function() {
            if(this.selectedIndex > 0) {
                document.getElementById('vendedor_nombre').value = this.options[this.selectedIndex].text;
            }
        });
    </script>
</body>
</html>
