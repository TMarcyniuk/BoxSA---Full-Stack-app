<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Box S.A.</title>
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f7f6;">
    <div class="card" style="width: 400px; text-align: center; padding: 40px;">
        <h2>Ingreso al Sistema</h2>
        <form method="POST" action="/login" onsubmit="setNombreVendedor()">
            <div class="form-group" style="text-align: left; margin-bottom: 20px;">
                <label for="vendedor_id">Seleccione su usuario:</label>
                <select name="vendedor_id" id="vendedor_id" required style="width: 100%; padding: 10px;">
                    <option value="">-- Seleccione un usuario --</option>
                    {% for v in vendedores %}
                        <option value="{{ v['idUsuario'] }}" data-nombre="{{ v['nombre'] }} {{ v['apellido'] }}">
                            {{ v['nombre'] }} {{ v['apellido'] }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <!-- Campo oculto para pasar el nombre al backend -->
            <input type="hidden" name="vendedor_nombre" id="vendedor_nombre">
            
            <button type="submit" class="btn-action" style="width: 100%;">Ingresar</button>
        </form>
    </div>

    <script>
        function setNombreVendedor() {
            const select = document.getElementById('vendedor_id');
            const opcionSeleccionada = select.options[select.selectedIndex];
            document.getElementById('vendedor_nombre').value = opcionSeleccionada.getAttribute('data-nombre');
        }
    </script>
</body>
</html>
